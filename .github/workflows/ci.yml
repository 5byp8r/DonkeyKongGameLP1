name: CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows,     os: windows-latest }
        - { name: Linux GCC,   os: ubuntu-latest }
        - { name: Linux Clang, os: ubuntu-latest, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
        - { name: macOS,       os: macos-latest  }
        config:
        - { name: Shared, flags: -DBUILD_SHARED_LIBS=TRUE }
        - { name: Static, flags: -DBUILD_SHARED_LIBS=FALSE }

    steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install libxrandr-dev libxcursor-dev libxi-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev libharfbuzz-dev libmbedtls-dev libssh2-1-dev libopenal-dev

    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure
      run: cmake -B build ${{matrix.platform.flags}} ${{matrix.config.flags}}

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Artifact
      shell: bash
      run: |
        mkdir -p dist/assets
        
        # 1. Copy Assets (always from the source tree repository)
        cp -r DonkeyKong/assets/* dist/assets/
        
        # 2. Find and copy the executable based on where the OS placed it
        if [ "${{ runner.os }}" = "Windows" ]; then
          cp build/bin/Release/MineKong.exe dist/
          # If your build generated SFML shared DLLs, copy them too:
          cp build/bin/Release/*.dll dist/ 2>/dev/null || true
        else
          cp build/bin/MineKong dist/
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: MineKong-${{ matrix.platform.name }}-${{ matrix.config.name }}-Build
        path: dist/
